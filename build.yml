          B64
          unzip -q payload.zip
          curl -fsSL -o src.zip https://github.com/Patrick-9936/nulls-headless-client/archive/refs/heads/main.zip
          unzip -q src.zip
          cp -r nulls-headless-client-main/. engine/
          rm -rf engine/tests engine/docs engine/Nulls.js engine/.devcontainer
          ls engine engine/mobile

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install bot engine dependencies
        working-directory: engine
        run: |
          npm ci --ignore-scripts --omit=dev
          node --check mobile/main.js
          node --check lib/Fleet.js

      - name: Install Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download Node.js for Android (nodejs-mobile)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nm
          gh release download v18.20.4 --repo nodejs-mobile/nodejs-mobile --pattern '*android.zip' --dir /tmp/nm \
            || gh release download --repo nodejs-mobile/nodejs-mobile --pattern '*android.zip' --dir /tmp/nm
          unzip -q /tmp/nm/*android.zip -d /tmp/nm/x
          ls -R /tmp/nm/x | head -40
          mkdir -p android/app/libnode
          cp -r /tmp/nm/x/*/bin android/app/libnode/bin 2>/dev/null || cp -r /tmp/nm/x/bin android/app/libnode/bin
          cp -r /tmp/nm/x/*/include android/app/libnode/include 2>/dev/null || cp -r /tmp/nm/x/include android/app/libnode/include
          test -f android/app/libnode/bin/arm64-v8a/libnode.so
          test -f android/app/libnode/include/node/node.h

      - name: Bundle the engine into the app
        run: |
          mkdir -p android/app/src/main/assets
          (cd engine && zip -qr ../android/app/src/main/assets/engine.zip .)
          ls -lh android/app/src/main/assets/engine.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nulls-fleet-apk
          path: android/app/build/outputs/apk/debug/nulls-fleet-debug.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/nulls-fleet-debug.apk
